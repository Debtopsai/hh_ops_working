<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<title>03 Hero Plinth</title>
<style>
  .scene { position: absolute; left: 0; right: 0; top: 520px; height: 880px; }
  .oven { position: absolute; left: 50%; top: 40px; width: 560px; height: 560px; margin-left: -280px; }
  .oven img { width: 100%; height: 100%; display: block; }
  .oven .tbc { position: absolute; left: 92px; top: 180px; width: 252px; text-align: center; font-family: var(--f-mono); font-weight: 600; font-size: 22px; line-height: 1.45; letter-spacing: .08em; color: var(--mute); }
  .plinth { position: absolute; left: 50%; top: 600px; width: 700px; margin-left: -350px; height: 120px; border-radius: 10px; box-shadow: 0 40px 80px rgba(0,0,0,.55); }
  .plinth::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: rgba(255,255,255,.22); border-radius: 10px 10px 0 0; }
  .wm { position: absolute; top: 400px; left: 0; right: 0; text-align: center; font-size: 76px; }
  .tag { position: absolute; top: 1270px; left: 0; right: 0; display: flex; justify-content: center; }
</style>
</head>
<body data-dur="1.5" data-frame="03">
<div class="viewport"><div class="stage">
  <!-- ⚠ No wordmark asset in repo: set in Space Grotesk 600 per brief. Swap for the live-site asset. -->
  <div class="wm wordmark" data-anim="fade" data-at="0" data-dur="0.35">HireHospo</div>
  <div class="scene">
    <div class="plinth steel" data-anim="rise" data-at="0" data-dur="0.5"></div>
    <div class="oven" data-anim="rise" data-at="0.06" data-dur="0.5">
      <img src="../shared/hero-oven-placeholder.svg" alt="">
      <div class="tbc">HERO RATIONAL<br>COMBI - TBC</div>
    </div>
  </div>
  <div class="tag" data-anim="fade" data-at="0.45" data-dur="0.3"><span class="chip">RATIONAL · COMBI OVEN</span></div>
  <div class="caption"><span>HireHospo finances a refurbished Rational,</span></div>
</div></div>
<script src="../shared/stage.js"></script>
</body>
</html>
