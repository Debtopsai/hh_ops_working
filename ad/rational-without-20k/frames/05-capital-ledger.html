<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<title>05 Capital Ledger</title>
<style>
  .ledger { position: absolute; top: 470px; left: 120px; right: 120px; background: var(--surface); border: 2px solid var(--line); border-radius: 28px; padding: 20px 52px; }
  .line { display: flex; align-items: center; justify-content: space-between; gap: 30px; padding: 44px 0; }
  .line + .line { border-top: 2px solid var(--line); }
  .line .txt { font-family: var(--f-mono); font-weight: 600; font-size: 40px; line-height: 1.3; letter-spacing: .08em; color: var(--ink); }
  .line .tick { width: 72px; height: 72px; }
  .lwp { position: absolute; top: 940px; left: 0; right: 0; text-align: center; font-family: var(--f-display); font-weight: 600; font-size: 92px; letter-spacing: -.02em; color: var(--flame); }
  .roles { position: absolute; top: 1150px; left: 120px; right: 120px; display: flex; justify-content: center; }
  .roles .chip { font-size: 26px; text-align: center; line-height: 1.45; border-radius: 28px; padding: 22px 34px; }
</style>
</head>
<body data-dur="2.5" data-frame="05">
<div class="viewport"><div class="stage">
  <div class="ledger" data-anim="fade" data-at="0" data-dur="0.25">
    <div class="line"><span class="txt">OVEN IN THE KITCHEN</span><span data-anim="tick" data-at="0.3" data-dur="0.3"><svg class="tick" viewBox="0 0 56 56" aria-hidden="true"><path d="M12 29 L24 41 L45 16"/></svg></span></div>
    <div class="line"><span class="txt">CAPITAL KEPT IN<br>THE BUSINESS</span><span data-anim="tick" data-at="1.0" data-dur="0.3"><svg class="tick" viewBox="0 0 56 56" aria-hidden="true"><path d="M12 29 L24 41 L45 16"/></svg></span></div>
  </div>
  <div class="lwp" data-anim="rise" data-at="1.4" data-dur="0.5">low weekly payments</div>
  <div class="roles" data-anim="fade" data-at="0.1" data-dur="0.3"><span class="chip">DELIVERED, INSTALLED &amp; SERVICED BY WASHPRO</span></div>
  <div class="caption" data-anim="fade" data-at="0" data-dur="0.2"><span>Low weekly payments. Your capital stays put.</span></div>
</div></div>
<script src="../shared/stage.js"></script>
</body>
</html>
