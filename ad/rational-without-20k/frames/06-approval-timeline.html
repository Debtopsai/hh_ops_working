<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<title>06 Approval Timeline</title>
<style>
  .steps { position: absolute; top: 470px; left: 180px; right: 180px; }
  .step { position: relative; display: flex; align-items: center; gap: 36px; height: 150px; }
  .step + .step::before { content: ""; position: absolute; left: 41px; top: -48px; width: 4px; height: 96px; background: var(--line); }
  .node { position: relative; width: 86px; height: 86px; border-radius: 50%; border: 3px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
  .node .tick { width: 54px; height: 54px; }
  .node .tick path { stroke: var(--ink2); }
  .step.ok .node .tick path { stroke: var(--approve); }
  .step .txt { font-family: var(--f-mono); font-weight: 600; font-size: 42px; letter-spacing: .08em; color: var(--ink2); }
  .step.ok .txt { color: var(--ink); font-weight: 700; }
  .micro { position: absolute; top: 1150px; left: 120px; right: 120px; text-align: center; font-family: var(--f-mono); font-weight: 500; font-size: 28px; letter-spacing: .08em; color: var(--mute); }
</style>
</head>
<body data-dur="1" data-frame="06">
<div class="viewport"><div class="stage">
  <div class="steps">
    <div class="step"><span class="node"><span data-anim="tick" data-at="0.1" data-dur="0.2"><svg class="tick" viewBox="0 0 56 56" aria-hidden="true"><path d="M12 29 L24 41 L45 16"/></svg></span></span><span class="txt">APPLY</span></div>
    <div class="step"><span class="node"><span data-anim="tick" data-at="0.3" data-dur="0.2"><svg class="tick" viewBox="0 0 56 56" aria-hidden="true"><path d="M12 29 L24 41 L45 16"/></svg></span></span><span class="txt">CREDIT CHECK</span></div>
    <div class="step ok"><span class="node"><span data-anim="tick" data-at="0.5" data-dur="0.2"><svg class="tick" viewBox="0 0 56 56" aria-hidden="true"><path d="M12 29 L24 41 L45 16"/></svg></span></span><span class="txt">APPROVED</span></div>
    <div class="step"><span class="node"><span data-anim="tick" data-at="0.7" data-dur="0.2"><svg class="tick" viewBox="0 0 56 56" aria-hidden="true"><path d="M12 29 L24 41 L45 16"/></svg></span></span><span class="txt">DELIVERED 1-3 DAYS</span></div>
  </div>
  <div class="micro">DELIVERY 1-3 BUSINESS DAYS AFTER DEPOSIT</div>
  <div class="caption"><span>Apply now.</span></div>
</div></div>
<script src="../shared/stage.js"></script>
</body>
</html>
