[build]
  publish = "public"
  command = "npm run test"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Hourly is ample. Meta reporting lags anyway and the sales cycle is 16 to 18
# days. Do not poll aggressively.
[functions."refresh"]
  schedule = "@hourly"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# The cached document is aggregate only and holds no lead level records, but it
# is still commercial data. It is not cached at the edge.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "private, no-store"

[[redirects]]
  from = "/api/dashboard"
  to = "/.netlify/functions/dashboard-data"
  status = 200

[[redirects]]
  from = "/api/refresh"
  to = "/.netlify/functions/refresh"
  status = 200
